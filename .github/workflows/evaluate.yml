name: RAG Evaluation Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Unit Tests
      run: |
        pytest tests/
        
    - name: Run RAG Evaluation Experiments
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        python scripts/run_experiments.py
        
    - name: Regression Check
      run: |
        # In a real environment, you would parse the metrics.csv
        # and fail the build if Recall@5 < 0.85
        python -c "
        import pandas as pd
        import sys
        try:
            df = pd.read_csv('results/metrics.csv')
            advanced_recall = df[df['Method'] == 'Advanced (Hybrid + Rerank)']['Recall@5'].values[0]
            if advanced_recall < 0.85:
                print(f'Regression detected! Recall@5 dropped to {advanced_recall}')
                sys.exit(1)
            print(f'Quality gate passed. Recall@5 is {advanced_recall}')
        except Exception as e:
            print(f'Error during threshold check: {e}')
            sys.exit(0)
        "
